<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Toymaker's Handbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-shell">
  <section class="stage-shell">
    <img class="tab-backing" src="assets/ui/backgrounds/tab-backing.png" alt="">
    <img class="book-bg" src="assets/ui/backgrounds/book.png" alt="">

    <nav class="sidebar" aria-label="Handbook pages">
      <button class="side-tab active" data-page="forms"><img src="assets/ui/sidebar/forms.png" alt="Forms"></button>
      <button class="side-tab" data-page="coat"><img src="assets/ui/sidebar/coat-studio.png" alt="Coat Studio"></button>
      <button class="side-tab" data-page="soul"><img src="assets/ui/sidebar/soul-atelier.png" alt="Soul Atelier"></button>
      <button class="side-tab" data-page="workshop"><img src="assets/ui/sidebar/toymakers-workshop.png" alt="Toymaker's Workshop"></button>
    </nav>

    <img class="header-img" src="assets/ui/header/handbook-header.png" alt="The Toymaker's Handbook">
    <button id="titlePageButton" class="title-page-button" aria-label="Title Page"><img src="assets/ui/header/title-page-button.png" alt=""></button>

    <section class="left-page">
      <img class="left-page-bg" src="assets/ui/backgrounds/left-page.png" alt="">
      <div id="pageContent" class="page-content"></div>
      <button id="backPage" class="page-arrow back"><img src="assets/ui/controls/buttons/back-button.png" alt="Previous"></button>
      <button id="nextPage" class="page-arrow next"><img src="assets/ui/controls/buttons/forward-button.png" alt="Next"></button>
      <span id="pageNumber" class="page-number">1</span>
    </section>

    <section class="right-page">
      <img class="renderer-panel" src="assets/ui/panels/renderer-panel.png" alt="">

      <div class="render-window" id="renderWindow">
        <img class="renderer-bg" src="assets/ui/backgrounds/renderer-background.png" alt="">
        <div id="viewport" class="viewport" title="Drag to move; scroll to zoom">
          <div id="renderWrap" class="render-wrap"><canvas id="renderCanvas" width="1740" height="1170"></canvas></div>
        </div>
        <div id="unsupportedMessage" class="unsupported-message" hidden></div>
      </div>

      <div class="zoom-ui">
        <button id="zoomOut" class="zoom-btn minus"><img src="assets/ui/controls/buttons/minus-button.png" alt="Zoom out"></button>
        <div class="view-slider-shell">
          <img class="view-slider-track" src="assets/ui/controls/sliders/view-slider-track.png" alt="">
          <img id="viewSliderThumb" class="view-slider-thumb" src="assets/ui/controls/sliders/view-slider-thumb.png" alt="">
          <input id="zoomRange" type="range" min="45" max="1000" value="200" aria-label="Zoom">
        </div>
        <button id="zoomIn" class="zoom-btn plus"><img src="assets/ui/controls/buttons/plus-button.png" alt="Zoom in"></button>
        <button id="resetView" class="reset-view"><img src="assets/ui/controls/buttons/reset-view-button.png" alt="Reset view"></button>
        <span id="zoomPercent">100%</span>
      </div>

      <!-- The card artwork already exists inside renderer-panel.png. Only values are live HTML. -->
      <div class="summary-values" aria-label="Current traits">
        <span id="summaryForm">Horse</span>
        <span id="summaryCoat">Warm Bay</span>
        <span>None</span><span>None</span><span>None</span><span>None</span>
      </div>

      <div class="action-hitboxes">
        <button id="randomizeBtn" class="action-image-button" aria-label="Randomize">
          <img src="assets/ui/controls/buttons/randomize-button.png"
               data-normal="assets/ui/controls/buttons/randomize-button.png"
               data-hover="assets/ui/controls/buttons/randomize-button-hover.png" alt="">
        </button>
        <button id="resetBtn" class="action-image-button" aria-label="Reset">
          <img src="assets/ui/controls/buttons/reset-button.png"
               data-normal="assets/ui/controls/buttons/reset-button.png"
               data-hover="assets/ui/controls/buttons/reset-button-hover.png" alt="">
        </button>
        <button id="exportBtn" class="action-image-button" aria-label="Export">
          <img src="assets/ui/controls/buttons/export-button.png"
               data-normal="assets/ui/controls/buttons/export-button.png"
               data-hover="assets/ui/controls/buttons/export-button-hover.png" alt="">
        </button>
      </div>
    </section>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
